openapi: 3.0.3
info:
  title: AI Web Scaffold API
  version: 0.2.0
  description: AI-friendly management system scaffold — spec-first, type-safe

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
  - name: Authentication
  - name: Users
  - name: Roles
  - name: Menus
  - name: Dictionaries

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [Health]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        default: { $ref: '#/components/responses/GlobalError' }

  /auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login succeeded or credentials were rejected
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/CurrentUserResponse' }
                  - { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/GlobalError' }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [Authentication]
      responses:
        '200':
          description: Logout completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptySuccessResponse' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the signed-in user
      tags: [Authentication]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserResponse' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }

  /admin/users:
    get:
      operationId: listUsers
      summary: List users
      tags: [Users]
      parameters:
        - { $ref: '#/components/parameters/PageNum' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Keyword' }
      responses:
        '200':
          description: User page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPageResponse' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }
    post:
      operationId: createUser
      summary: Create a user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '200': { $ref: '#/components/responses/MutationResult' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }
  /admin/users/{id}:
    parameters:
      - { $ref: '#/components/parameters/ResourceId' }
    put:
      operationId: updateUser
      summary: Update a user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/MutationResult' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '404': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }
    delete:
      operationId: deleteUser
      summary: Soft-delete a user
      tags: [Users]
      responses:
        '200': { $ref: '#/components/responses/EmptyResult' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '404': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }

  /admin/roles:
    get:
      operationId: listRoles
      summary: List roles
      tags: [Roles]
      parameters:
        - { $ref: '#/components/parameters/PageNum' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Keyword' }
      responses:
        '200':
          description: Role page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolePageResponse' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }
    post:
      operationId: createRole
      summary: Create a role
      tags: [Roles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleRequest' }
      responses:
        '200': { $ref: '#/components/responses/MutationResult' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }
  /admin/roles/{id}:
    parameters:
      - { $ref: '#/components/parameters/ResourceId' }
    put:
      operationId: updateRole
      summary: Update a role
      tags: [Roles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleRequest' }
      responses:
        '200': { $ref: '#/components/responses/MutationResult' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '404': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }
    delete:
      operationId: deleteRole
      summary: Soft-delete a role
      tags: [Roles]
      responses:
        '200': { $ref: '#/components/responses/EmptyResult' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '404': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }

  /admin/menus:
    get:
      operationId: listMenus
      summary: List menus
      tags: [Menus]
      parameters:
        - { $ref: '#/components/parameters/PageNum' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Keyword' }
      responses:
        '200':
          description: Menu page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuPageResponse' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }
    post:
      operationId: createMenu
      summary: Create a menu
      tags: [Menus]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuRequest' }
      responses:
        '200': { $ref: '#/components/responses/MutationResult' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }
  /admin/menus/{id}:
    parameters:
      - { $ref: '#/components/parameters/ResourceId' }
    put:
      operationId: updateMenu
      summary: Update a menu
      tags: [Menus]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuRequest' }
      responses:
        '200': { $ref: '#/components/responses/MutationResult' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '404': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }
    delete:
      operationId: deleteMenu
      summary: Soft-delete a menu
      tags: [Menus]
      responses:
        '200': { $ref: '#/components/responses/EmptyResult' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '404': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }

  /admin/dictionaries:
    get:
      operationId: listDictionaries
      summary: List dictionary entries
      tags: [Dictionaries]
      parameters:
        - { $ref: '#/components/parameters/PageNum' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Keyword' }
      responses:
        '200':
          description: Dictionary page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryPageResponse' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }
    post:
      operationId: createDictionary
      summary: Create a dictionary entry
      tags: [Dictionaries]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictionaryRequest' }
      responses:
        '200': { $ref: '#/components/responses/MutationResult' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }
  /admin/dictionaries/{id}:
    parameters:
      - { $ref: '#/components/parameters/ResourceId' }
    put:
      operationId: updateDictionary
      summary: Update a dictionary entry
      tags: [Dictionaries]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictionaryRequest' }
      responses:
        '200': { $ref: '#/components/responses/MutationResult' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '404': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }
    delete:
      operationId: deleteDictionary
      summary: Soft-delete a dictionary entry
      tags: [Dictionaries]
      responses:
        '200': { $ref: '#/components/responses/EmptyResult' }
        '401': { $ref: '#/components/responses/GlobalError' }
        '404': { $ref: '#/components/responses/GlobalError' }
        '500': { $ref: '#/components/responses/GlobalError' }

components:
  parameters:
    PageNum:
      name: pageNum
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    Keyword:
      name: keyword
      in: query
      schema: { type: string, maxLength: 100 }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    GlobalError:
      description: Global HTTP failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    MutationResult:
      description: Mutation result or business failure
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '#/components/schemas/IdResponse' }
              - { $ref: '#/components/schemas/ErrorResponse' }
    EmptyResult:
      description: Mutation completed or business failure
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: '#/components/schemas/EmptySuccessResponse' }
              - { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    AuditFields:
      type: object
      required: [isDeleted, createdAt, createdBy, updatedAt, updatedBy]
      properties:
        isDeleted: { type: boolean }
        createdAt: { type: string, format: date-time }
        createdBy: { type: integer }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: integer }
    HealthData:
      type: object
      required: [status, timestamp]
      properties:
        status: { type: string, enum: [ok] }
        timestamp: { type: string, format: date-time }
    HealthResponse:
      type: object
      required: [status, data]
      properties:
        status: { type: integer, enum: [0] }
        data: { $ref: '#/components/schemas/HealthData' }
    ErrorResponse:
      type: object
      required: [status, err]
      properties:
        status: { type: integer, minimum: 1 }
        err: { type: string }
    EmptySuccessResponse:
      type: object
      required: [status]
      properties:
        status: { type: integer, enum: [0] }
    IdData:
      type: object
      required: [id]
      properties:
        id: { type: integer }
    IdResponse:
      type: object
      required: [status, data]
      properties:
        status: { type: integer, enum: [0] }
        data: { $ref: '#/components/schemas/IdData' }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 2, maxLength: 50 }
        password: { type: string, minLength: 8, maxLength: 128 }
    CurrentUser:
      type: object
      required: [id, username, displayName, roles]
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: string }
        roles:
          type: array
          items: { type: string }
    CurrentUserResponse:
      type: object
      required: [status, data]
      properties:
        status: { type: integer, enum: [0] }
        data: { $ref: '#/components/schemas/CurrentUser' }
    UserSummary:
      allOf:
        - { $ref: '#/components/schemas/AuditFields' }
        - type: object
          required: [id, username, displayName, email, enabled, roleIds]
          properties:
            id: { type: integer }
            username: { type: string }
            displayName: { type: string }
            email: { type: string, format: email }
            enabled: { type: boolean }
            roleIds:
              type: array
              items: { type: integer }
            lastLoginAt: { type: string, format: date-time, nullable: true }
    UserCreateRequest:
      type: object
      required: [username, displayName, email, password, enabled, roleIds]
      properties:
        username: { type: string, minLength: 2, maxLength: 50 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        enabled: { type: boolean }
        roleIds:
          type: array
          items: { type: integer }
    UserUpdateRequest:
      type: object
      required: [displayName, email, enabled, roleIds]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        enabled: { type: boolean }
        roleIds:
          type: array
          items: { type: integer }
    UserPageResponse:
      type: object
      required: [status, list, total]
      properties:
        status: { type: integer, enum: [0] }
        list:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        total: { type: integer, minimum: 0 }
    RoleSummary:
      allOf:
        - { $ref: '#/components/schemas/AuditFields' }
        - type: object
          required: [id, name, code, description, enabled, menuIds]
          properties:
            id: { type: integer }
            name: { type: string }
            code: { type: string }
            description: { type: string }
            enabled: { type: boolean }
            menuIds:
              type: array
              items: { type: integer }
    RoleRequest:
      type: object
      required: [name, code, description, enabled, menuIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        code: { type: string, minLength: 2, maxLength: 50, pattern: '^[A-Z0-9_]+$' }
        description: { type: string, maxLength: 200 }
        enabled: { type: boolean }
        menuIds:
          type: array
          items: { type: integer }
    RolePageResponse:
      type: object
      required: [status, list, total]
      properties:
        status: { type: integer, enum: [0] }
        list:
          type: array
          items: { $ref: '#/components/schemas/RoleSummary' }
        total: { type: integer, minimum: 0 }
    MenuSummary:
      allOf:
        - { $ref: '#/components/schemas/AuditFields' }
        - type: object
          required: [id, parentId, name, code, path, icon, sortOrder, type, enabled]
          properties:
            id: { type: integer }
            parentId: { type: integer }
            name: { type: string }
            code: { type: string }
            path: { type: string }
            icon: { type: string }
            sortOrder: { type: integer }
            type: { type: string, enum: [directory, menu, button] }
            enabled: { type: boolean }
    MenuRequest:
      type: object
      required: [parentId, name, code, path, icon, sortOrder, type, enabled]
      properties:
        parentId: { type: integer, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 80 }
        code: { type: string, minLength: 2, maxLength: 80 }
        path: { type: string, maxLength: 160 }
        icon: { type: string, maxLength: 50 }
        sortOrder: { type: integer, minimum: 0 }
        type: { type: string, enum: [directory, menu, button] }
        enabled: { type: boolean }
    MenuPageResponse:
      type: object
      required: [status, list, total]
      properties:
        status: { type: integer, enum: [0] }
        list:
          type: array
          items: { $ref: '#/components/schemas/MenuSummary' }
        total: { type: integer, minimum: 0 }
    DictionarySummary:
      allOf:
        - { $ref: '#/components/schemas/AuditFields' }
        - type: object
          required: [id, type, label, value, sortOrder, enabled, remark]
          properties:
            id: { type: integer }
            type: { type: string }
            label: { type: string }
            value: { type: string }
            sortOrder: { type: integer }
            enabled: { type: boolean }
            remark: { type: string }
    DictionaryRequest:
      type: object
      required: [type, label, value, sortOrder, enabled, remark]
      properties:
        type: { type: string, minLength: 1, maxLength: 80 }
        label: { type: string, minLength: 1, maxLength: 80 }
        value: { type: string, minLength: 1, maxLength: 120 }
        sortOrder: { type: integer, minimum: 0 }
        enabled: { type: boolean }
        remark: { type: string, maxLength: 200 }
    DictionaryPageResponse:
      type: object
      required: [status, list, total]
      properties:
        status: { type: integer, enum: [0] }
        list:
          type: array
          items: { $ref: '#/components/schemas/DictionarySummary' }
        total: { type: integer, minimum: 0 }
