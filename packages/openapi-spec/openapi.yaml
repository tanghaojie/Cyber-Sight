openapi: 3.0.3
info:
  title: AI Web Scaffold API
  version: 0.1.0
  description: AI-friendly web scaffold — spec-first, type-safe

servers:
  - url: http://localhost:3000
    description: Local development

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        default:
          description: Global HTTP failure; business APIs only use HTTP 401, 404, or 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthData:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time
    HealthResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: integer
          enum: [0]
        data:
          $ref: '#/components/schemas/HealthData'
        err:
          type: string
    ErrorResponse:
      type: object
      required:
        - status
        - err
      properties:
        status:
          type: integer
          minimum: 1
        err:
          type: string
    PaginationRequest:
      type: object
      properties:
        pageNum:
          type: integer
          minimum: 1
          example: 1
          description: 1-based page number; defaults to 1 when omitted
        pageSize:
          type: integer
          minimum: 1
          example: 10
          description: Number of items per page; defaults to 10 when omitted
    PaginationResponse:
      type: object
      required:
        - status
        - list
        - total
      properties:
        status:
          type: integer
        list:
          type: array
          items: {}
        total:
          type: integer
          minimum: 0
        err:
          type: string
